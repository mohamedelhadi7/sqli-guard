ite}@keyframes o15{0%,29.807%{opacity:0}30.007%,97%{opacity:1}100%{opacity:0}}#t15{opacity:0;animation:o15 13.75s step-end infinite}@keyframes o16{0%,30.607%{opacity:0}30.807%,97%{opacity:1}100%{opacity:0}}#t16{opacity:0;animation:o16 13.75s step-end infinite}@keyframes o17{0%,31.407%{opacity:0}31.607%,97%{opacity:1}100%{opacity:0}}#t17{opacity:0;animation:o17 13.75s step-end infinite}@keyframes o18{0%,32.207%{opacity:0}32.407%,97%{opacity:1}100%{opacity:0}}#t18{opacity:0;animation:o18 13.75s step-end infinite}@keyframes o19{0%,33.008%{opacity:0}33.208%,97%{opacity:1}100%{opacity:0}}#t19{opacity:0;animation:o19 13.75s step-end infinite}@keyframes o20{0%,33.808%{opacity:0}34.008%,97%{opacity:1}100%{opacity:0}}#t20{opacity:0;animation:o20 13.75s step-end infinite}@keyframes o21{0%,34.608%{opacity:0}34.808%,97%{opacity:1}100%{opacity:0}}#t21{opacity:0;animation:o21 13.75s step-end infinite}@keyframes o22{0%,35.408%{opacity:0}35.608%,97%{opacity:1}100%{opacity:0}}#t22{opacity:0;animation:o22 13.75s step-end infinite}@keyframes o23{0%,36.209%{opacity:0}36.409%,97%{opacity:1}100%{opacity:0}}#t23{opacity:0;animation:o23 13.75s step-end infinite}@keyframes o24{0%,37.009%{opacity:0}37.209%,97%{opacity:1}100%{opacity:0}}#t24{opacity:0;animation:o24 13.75s step-end infinite}@keyframes o25{0%,37.809%{opacity:0}38.009%,97%{opacity:1}100%{opacity:0}}#t25{opacity:0;animation:o25 13.75s step-end infinite}@keyframes o26{0%,38.609%{opacity:0}38.809%,97%{opacity:1}100%{opacity:0}}#t26{opacity:0;animation:o26 13.75s step-end infinite}@keyframes o27{0%,39.410%{opacity:0}39.610%,97%{opacity:1}100%{opacity:0}}#t27{opacity:0;animation:o27 13.75s step-end infinite}@keyframes o28{0%,40.210%{opacity:0}40.410%,97%{opacity:1}100%{opacity:0}}#t28{opacity:0;animation:o28 13.75s step-end infinite}@keyframes o29{0%,41.010%{opacity:0}41.210%,97%{opacity:1}100%{opacity:0}}#t29{opacity:0;animation:o29 13.75s step-end infinite}@keyframes o30{0%,41.810%{opacity:0}42.010%,97%{opacity:1}100%{opacity:0}}#t