<text x="418" y="19" fill="#8F98B6" text-anchor="middle">sqli-guard: static checker demo</text>
<clipPath id="k0"><rect id="r0" x="18" y="32" height="19" width="0"/></clipPath><text x="18" y="46" clip-path="url(#k0)"><tspan fill="#93A0FF">$ </tspan><tspan fill="#FFFFFF">python checker.py samples/vulnerable_other.py</tspan></text><text id="t1" x="18" y="65" fill="#F3AC40">== command_injection (3) ==</text><text id="t2" x="18" y="84" fill="#D7DBEA">  samples/vulnerable_other.py:12 - string concatenation with a variable (via variable &#x27;cmd&#x27;)</text><text id="t3" x="18" y="103" fill="#52D293">    fix: Avoid a shell string built from input: use subprocess.run([...], shell=False) with a list </text><text id="t4" x="18" y="122" fill="#D7DBEA">        of arguments, or shlex.quote() if a shell is required.</text><text id="t5" x="18" y="141" fill="#D7DBEA">  samples/vulnerable_other.py:16 - string concatenation with a variable</text><text id="t6" x="18" y="160" fill="#52D293">    fix: Avoid a shell string built from input: use subprocess.run([...], shell=False) with a list </text><text id="t7" x="18" y="179" fill="#D7DBEA">        of arguments, or shlex.quote() if a shell is required.</text><text id="t8" x="18" y="198" fill="#D7DBEA">  samples/vulnerable_other.py:21 - string concatenation with a variable (via variable &#x27;cmd&#x27;)</text><text id="t9" x="18" y="217" fill="#52D293">    fix: subprocess(..., shell=True) with input in the command string is a shell-injection risk: </text><text id="t10" x="18" y="236" fill="#D7DBEA">        build the command as a list and drop shell=True.</text><text id="t11" x="18" y="255" fill="#F3AC40">== insecure_deserialization (2) ==</text><text id="t12" x="18" y="274" fill="#D7DBEA">  samples/vulnerable_other.py:40 - data read from a variable, not a fixed literal</text><text id="t13" x="18" y="293" fill="#52D293">    fix: pickle can execute arbitrary code on load; use a safe format (json) or verify/sign the data</text><text id="t14" x="18" y="312" fill="#D7DBEA">         before unpickling it.</text><text id="t15" x="18" y="331" fill="#D7DBEA">  samples/vulnerable_other.py:44 - yaml.load() without Loader=yaml.SafeLoader</text><text id="t16" x="18" y="350" fill="#52D293">    fix: Use yaml.safe_load() (or Loader=yaml.SafeLoader): plain yaml.load() can construct arbitrary</text><text id="t17" x="18" y="369" fill="#D7DBEA">         Python objects from the input.</text><text id="t18" x="18" y="388" fill="#F3AC40">== path_traversal (1) ==</text><text id="t19" x="18" y="407" fill="#D7DBEA">  samples/vulnerable_other.py:26 - string concatenation with a variable (via variable &#x27;path&#x27;)</text><text id="t20" x="18" y="426" fill="#52D293">    fix: Validate and resolve the path (e.g. os.path.realpath + check it stays under a known base </text><text id="t21" x="18" y="445" fill="#D7DBEA">        directory) before opening it with user-supplied input.</text><text id="t22" x="18" y="464" fill="#F3AC40">== weak_hash (2) ==</text><text id="t23" x="18" y="483" fill="#D7DBEA">  samples/vulnerable_other.py:31 - md5() used on &#x27;password&#x27;, which looks like a password/secret</text><text id="t24" x="18" y="502" fill="#52D293">    fix: Use a password-hashing function with a salt and work factor (e.g. bcrypt, scrypt, or </text><text id="t25" x="18" y="521" fill="#D7DBEA">        hashlib.pbkdf2_hmac), never a fast general-purpose hash for passwords.</text><text id="t26" x="18" y="540" fill="#D7DBEA">  samples/vulnerable_other.py:35 - sha1() used on &#x27;pwd&#x27;, which looks like a password/secret</text><text id="t27" x="18" y="559" fill="#52D293">    fix: Use a password-hashing function with a salt and work factor (e.g. bcrypt, scrypt, or </text><text id="t28" x="18" y="578" fill="#D7DBEA">        hashlib.pbkdf2_hmac), never a fast general-purpose hash for passwords.</text><text id="t29" x="18" y="597" fill="#D7DBEA"></text><text id="t30" x="18" y="616" fill="#FF8F88">8 finding(s) across 4 categories.</text><clipPath id="k32"><rect id="r32" x="18" y="640" height="19" width="0"/></clipPath><text x="18" y="654" clip-path="url(#k32)"><tspan fill="#93A0FF">$ </tspan><tspan fill="#FFFFFF">python checker.py samples/fixed_other.py</tspan></text><text id="t33" x="18" y="673" fill="#52D293">No issues found.</text>
</svg>
